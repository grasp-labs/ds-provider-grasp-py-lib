package-name: grasp
name: grasp
description: GRASP provider for the DS Business Workflow


dataset:
  - name: Grasp Cart
    type: ds.resource.dataset.grasp-cart
    version: 1.0.0
    description: Grasp dataset
    class_name: ds_provider_grasp_py_lib.dataset.cart.GraspCartDataset

  - name: Grasp Ingress
    type: ds.resource.dataset.grasp-ingress
    version: 1.0.0
    description: Grasp ingress dataset
    class_name: ds_provider_grasp_py_lib.dataset.ingress.GraspIngressDataset

  - name: Grasp File
    type: ds.resource.dataset.grasp-file
    version: 1.0.0
    description: Grasp file dataset
    class_name: ds_provider_grasp_py_lib.dataset.file.GraspFileDataset

  - name: Grasp Gold
    type: ds.resource.dataset.grasp-gold
    version: 1.0.0
    description: Grasp gold dataset
    class_name: ds_provider_grasp_py_lib.dataset.gold.GraspGoldDataset


linked_service:
  - name: Grasp IAM Role
    type: ds.linked-service.grasp-iam-role
    version: 1.0.0
    description: Grasp linked service that assumes a client-dedicated IAM role
    class_name: ds_provider_grasp_py_lib.linked_service.iam_role.GraspIAMRoleLinkedService
